name: BodyweightProgression
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant]
settings:
  base:
    APP_ID: com.hgsldswk.bodyweightprogression
    APP_STORE_ID: ""
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  BodyweightProgression:
    type: application
    platform: iOS
    sources: [BodyweightProgression, Shared]
    dependencies:
      - target: BodyweightProgressionWidget
        embed: true
    entitlements:
      path: BodyweightProgression/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hgsldswk.bodyweightprogression]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: BodyweightProgression AppStore
    info:
      path: BodyweightProgression/Info.plist
      properties:
        CFBundleDisplayName: Bodyweight Progression
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        APP_STORE_ID: $(APP_STORE_ID)
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_ID)
            CFBundleURLSchemes: [bwprogression]
  BodyweightProgressionWidget:
    type: app-extension
    platform: iOS
    sources:
      - BodyweightProgressionWidget
      - Shared
    entitlements:
      path: BodyweightProgressionWidget/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hgsldswk.bodyweightprogression]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).widget
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: BodyweightProgression Widget AppStore
    info:
      path: BodyweightProgressionWidget/Info.plist
      properties:
        CFBundleDisplayName: Bodyweight Progression
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  BodyweightProgressionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BodyweightProgressionTests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  BodyweightProgressionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BodyweightProgressionUITests]
    dependencies:
      - target: BodyweightProgression
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BodyweightProgression
schemes:
  BodyweightProgression:
    build:
      targets:
        BodyweightProgression: all
        BodyweightProgressionTests: [test]
    test:
      config: Debug
      targets: [BodyweightProgressionTests]
  BodyweightProgressionUI:
    build:
      targets:
        BodyweightProgression: all
        BodyweightProgressionUITests: [test]
    test:
      config: Debug
      targets: [BodyweightProgressionUITests]
